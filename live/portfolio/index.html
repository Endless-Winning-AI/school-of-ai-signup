<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The School of AI — Portfolio of Ideas</title>
  <meta name="description" content="Real AI builds, real results. From Endless Winning's School of AI.">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face {
      font-family: 'Gilroy';
      src: url('../../assets/fonts/gilroy-regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gilroy';
      src: url('../../assets/fonts/gilroy-regular.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gilroy';
      src: url('../../assets/fonts/gilroy-bold.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gilroy';
      src: url('../../assets/fonts/gilroy-bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Gilroy', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    .gradient-title {
      background: linear-gradient(4.67deg, #389ABF 4.69%, #8BF1F1 51.21%, #5FFCC0 95.94%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tier-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      background: linear-gradient(135deg, rgba(139, 241, 241, 0.15), rgba(95, 252, 192, 0.15));
      border: 1px solid rgba(139, 241, 241, 0.3);
      color: #8BF1F1;
    }

    .tier-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: #8BF1F1;
      box-shadow: 0 0 8px rgba(139, 241, 241, 0.8);
    }

    .glass-card {
      background: rgba(12, 16, 32, 0.35);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid transparent;
      border-top-color: rgba(255, 255, 255, 0.25);
      border-left-color: rgba(255, 255, 255, 0.14);
      border-right-color: rgba(255, 255, 255, 0.05);
      border-bottom-color: rgba(255, 255, 255, 0.02);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('../../assets/form-texture.png');
      background-size: cover;
      opacity: 0.05;
      pointer-events: none;
      border-radius: inherit;
    }

    .btn-glow-wrapper {
      position: relative;
      display: inline-block;
    }

    .btn-glow-outer {
      position: absolute;
      inset: -3px;
      border-radius: 9999px;
      background: conic-gradient(from 180deg,
        #AF52DE 0deg,
        #FF2D92 52deg,
        #FF6482 82deg,
        #FF9500 94deg,
        #FFD60A 124deg,
        #30D158 180deg,
        #2EC4B6 236deg,
        #40CBF0 266deg,
        #007AFF 278deg,
        #5856D6 308deg,
        #AF52DE 360deg
      );
      filter: blur(14px);
      opacity: 0.44;
      pointer-events: none;
      z-index: 0;
    }

    .btn-glow-wrapper:hover .btn-glow-outer {
      opacity: 0.56;
      filter: blur(18px);
    }

    .btn-glow {
      position: relative;
      z-index: 1;
      border: none !important;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 16px 32px;
      border-radius: 9999px;
      background: rgba(10, 14, 30, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: white;
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      transition: transform 0.15s;
    }

    .btn-glow:active {
      transform: scale(0.98);
    }

    .btn-glow::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      padding: 1px;
      background: conic-gradient(from 180deg,
        #AF52DE 0deg,
        #FF2D92 52deg,
        #FF6482 82deg,
        #FF9500 94deg,
        #FFD60A 124deg,
        #30D158 180deg,
        #2EC4B6 236deg,
        #40CBF0 266deg,
        #007AFF 278deg,
        #5856D6 308deg,
        #AF52DE 360deg
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      background: #5FFCC0;
      box-shadow: 0 0 12px rgba(95, 252, 192, 0.9);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
  </style>
</head>
<body class="bg-black min-h-screen font-sans overflow-x-hidden">

  <!-- Background Image -->
  <div class="fixed inset-0">
    <img src="../../assets/background.png" alt="" class="w-full h-full object-cover opacity-55 pointer-events-none">
  </div>

  <!-- Main Content -->
  <div class="relative z-10 min-h-screen flex items-center justify-center px-4 py-12">

    <div class="w-full max-w-[560px]">

      <div class="glass-card p-8 sm:p-12">
        <div class="relative z-10 flex flex-col items-center gap-6 text-center">

          <div class="tier-pill">
            <span class="pulse-dot"></span>
            Coming Soon
          </div>

          <h1 class="gradient-title font-semibold text-[36px] sm:text-[52px] leading-[1.05]">
            Portfolio of Ideas
          </h1>

          <p class="text-white/80 text-[16px] sm:text-[18px] leading-relaxed max-w-[420px]">
            Real AI builds, real results. Launching this week.
          </p>

          <p class="text-white/60 text-[14px] leading-relaxed max-w-[460px]">
            Troy's showcase of AI projects — with breakdowns of how each one works — is on its way. Check back soon.
          </p>

          <div class="mt-4">
            <div class="btn-glow-wrapper">
              <div class="btn-glow-outer"></div>
              <a href="/live" class="btn-glow">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M15 6C15 6 9 10.4189 9 12C9 13.5812 15 18 15 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Back to hub</span>
              </a>
            </div>
          </div>

        </div>
      </div>

      <p class="text-white/40 text-[12px] text-center mt-8">
        An <a href="https://endlesswinning.com" class="text-[#8BF1F1] hover:underline">Endless Winning</a> resource
      </p>

    </div>
  </div>

  <script src="/live/assets/live-gate.js" defer></script>
</body>
</html>
